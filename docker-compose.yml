services:
  frontend:
    build:
      context: ./VueProject
      dockerfile: Dockerfile
    container_name: vue-frontend
    ports:
      - "8080:80"  # Фронтенд доступен на порту 8080
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  backend:
    build:
      context: ./PythonProjectDkor/dkor_crm
      dockerfile: Dockerfile
      args:
        # Передаем переменные окружения для сборки
        - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
        - DJANGO_DEBUG=${DJANGO_DEBUG}
        - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
        - MYSQL_DATABASE=${MYSQL_DATABASE}
        - MYSQL_USER=${MYSQL_USER}
        - MYSQL_PASSWORD=${MYSQL_PASSWORD}
        - MYSQL_HOST=${MYSQL_HOST}
        - MYSQL_PORT=${MYSQL_PORT}
    container_name: backend-api
    ports:
      - "8000:8000"  # Бэкенд доступен на порту 8000
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      # Создаем volumes для статических и медиа файлов
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ping/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  static_volume:
  media_volume:

networks:
  app-network:
    driver: bridge


