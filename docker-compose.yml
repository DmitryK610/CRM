version: "3.9"
services:
  frontend:
    build:
      context: ./VueProject
      dockerfile: Dockerfile
    container_name: vue-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    # depends_on:
    #   - backend

  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: backend
  #   ports:
  #     - "8000:8000"
  #   restart: unless-stopped
  #   environment:
  #     - ...
  #   volumes:
  #     - ./backend:/app/backend
  #   depends_on:
  #     - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: your_db
      MYSQL_USER: your_user
      MYSQL_PASSWORD: your_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
