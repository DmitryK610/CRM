services:
  frontend:
    build:
      context: ./VueProject
      dockerfile: Dockerfile
    container_name: vue-frontend
    ports:
      # Этот порт нужен, чтобы 1Panel мог проксировать запросы к фронтенду
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  backend:
    build:
      context: ./PythonProjectDkor/dkor_crm
      dockerfile: Dockerfile
    container_name: backend-api
    # ИСПРАВЛЕНИЕ: Заменили 'expose' на 'ports', чтобы открыть 8000 порт на хост-машине
    ports:
      - "8000:8000" # Теперь порт 8000 будет доступен напрямую извне VPS
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./data/staticfiles:/app/staticfiles # Для прямого обслуживания Nginx
      - ./data/mediafiles:/app/mediafiles   # Для прямого обслуживания Nginx
    networks:
      - app-network
    # Добавляем возможность доступа к host network для MySQL
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Убедитесь, что эндпоинт /health/ping/ существует в вашем Django-проекте
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ping/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  app-network:
    driver: bridge

volumes:
  # Тома для статических и медиа файлов
  static_volume:
  media_volume: