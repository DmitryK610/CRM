services:
  frontend:
    build:
      context: ./VueProject
      dockerfile: Dockerfile
    container_name: vue-frontend
    # Пробрасываем порты наружу для доступа OpenResty
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - app-network

  backend:
    build:
      context: ./PythonProjectDkor/dkor_crm
      dockerfile: Dockerfile
    container_name: backend-api
    # Пробрасываем порты наружу для доступа OpenResty
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      # Создаем volumes для статических и медиа файлов
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ping/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  static_volume:
  media_volume:

networks:
  app-network:
    driver: bridge


