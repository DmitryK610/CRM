version: '3.8'

services:
  frontend:
    build:
      context: ./VueProject
      dockerfile: Dockerfile
    container_name: vue-frontend
    ports:
      # Этот порт нужен, чтобы 1Panel мог проксировать запросы к фронтенду
      - "8080:80" 
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  backend:
    build:
      context: ./PythonProjectDkor/dkor_crm
      dockerfile: Dockerfile
    container_name: backend-api
    # Порт 8000 будет доступен внутри Docker, но не снаружи. 
    # Это безопаснее, так как доступ пойдет через 1Panel.
    expose:
      - "8000"
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      # Том для кода больше не нужен в продакшене, 
      # так как код копируется в образ при сборке.
      # Оставляем только тома для статики и медиа.
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    networks:
      - app-network
    healthcheck:
      # Убедитесь, что эндпоинт /health/ping/ существует в вашем Django-проекте
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ping/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  app-network:
    driver: bridge

volumes:
  # Тома для статических и медиа файлов
  static_volume:
  media_volume: