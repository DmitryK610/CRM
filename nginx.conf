server {
    listen 80;
    server_name localhost dkor.pro; # Правильное использование директивы server_name

    # БЛОК ДЛЯ ПРОКСИРОВАНИЯ API-ЗАПРОСОВ НА БЭКЕНД
    # Все запросы, начинающиеся с /api/, будут перенаправлены на сервис backend-api
    location /api/ {
        proxy_pass http://backend-api:8000; # Имя сервиса бэкенда в Docker Compose и его внутренний порт
        proxy_set_header Host $host; # Передает оригинальный Host-заголовок
        proxy_set_header X-Real-IP $remote_addr; # Передает реальный IP клиента
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Передает цепочку прокси
        proxy_set_header X-Forwarded-Proto $scheme; # Передает протокол (http/https)
        # Дополнительные настройки для CORS, если бэкенд их не обрабатывает полностью
        # add_header 'Access-Control-Allow-Origin' '*';
        # add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        # add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        # add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
    }

    # БЛОК ДЛЯ ПРОКСИРОВАНИЯ ADMIN-ИНТЕРФЕЙСА НА БЭКЕНД
    # Все запросы, начинающиеся с /admin/, будут перенаправлены на сервис backend-api
    location /admin/ {
        proxy_pass http://backend-api:8000; # Имя сервиса бэкенда в Docker Compose и его внутренний порт
        proxy_set_header Host $host; # Передает оригинальный Host-заголовок
        proxy_set_header X-Real-IP $remote_addr; # Передает реальный IP клиента
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Передает цепочку прокси
        proxy_set_header X-Forwarded-Proto $scheme; # Передает протокол (http/https)
    }

    # БЛОК ДЛЯ ПРОКСИРОВАНИЯ STATIC FILES (CSS, JS для админки)
    location /static/ {
        proxy_pass http://backend-api:8000; # Имя сервиса бэкенда в Docker Compose и его внутренний порт
        proxy_set_header Host $host; # Передает оригинальный Host-заголовок
        proxy_set_header X-Real-IP $remote_addr; # Передает реальный IP клиента
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Передает цепочку прокси
        proxy_set_header X-Forwarded-Proto $scheme; # Передает протокол (http/https)
    }

    # БЛОК ДЛЯ ПРОКСИРОВАНИЯ MEDIA FILES (загруженные файлы)
    location /media/ {
        proxy_pass http://backend-api:8000; # Имя сервиса бэкенда в Docker Compose и его внутренний порт
        proxy_set_header Host $host; # Передает оригинальный Host-заголовок
        proxy_set_header X-Real-IP $remote_addr; # Передает реальный IP клиента
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Передает цепочку прокси
        proxy_set_header X-Forwarded-Proto $scheme; # Передает протокол (http/https)
    }

    # БЛОК ДЛЯ ПРОКСИРОВАНИЯ HEALTHCHECK
    location /health/ {
        proxy_pass http://backend-api:8000; # Имя сервиса бэкенда в Docker Compose и его внутренний порт
        proxy_set_header Host $host; # Передает оригинальный Host-заголовок
        proxy_set_header X-Real-IP $remote_addr; # Передает реальный IP клиента
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Передает цепочку прокси
        proxy_set_header X-Forwarded-Proto $scheme; # Передает протокол (http/https)
    }

    # БЛОК ДЛЯ ФРОНТЕНДА (должен быть последним)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # Исправление для Vue Router history mode
    }
}
